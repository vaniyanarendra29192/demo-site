<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explore 2 and 3 BHK residences, floor plans, amenities and shops at The Neelkanth Heritage in Narol, Ahmedabad.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Neelkanth Heritage">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Neelkanth Heritage</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #heritage-loading {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 1rem;
      padding: 1.5rem;
      overflow: auto;
      background: #faf5ef;
      color: #762c1b;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }

    #heritage-loading img {
      display: block;
      width: min(23rem, 82vw);
      max-height: 48vh;
      height: auto;
      object-fit: contain;
    }

    .loading-spinner {
      width: 1.5rem;
      height: 1.5rem;
      border: 3px solid #e9dfd5;
      border-top-color: #762c1b;
      border-radius: 50%;
      animation: loading-spin .8s linear infinite;
    }

    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation: none; }
    }
  </style>
</head>
<body>
  <div id="heritage-loading">
    <img src="heritage-loading-logo.jpg" alt="The Neelkanth Heritage">
    <span class="loading-spinner" aria-hidden="true"></span>
    <span role="status">Loading the website…</span>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('heritage-loading').remove();
    }, { once: true });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
